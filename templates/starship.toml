"$schema" = "https://starship.rs/config-schema.json"
# DMS updates only the marked palette below; the prompt layout is user-owned.
palette = "zz"

format = """
[](surface0)\
$os\
$username\
[](fg:surface0 bg:peach)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$dotnet\
[](fg:teal bg:blue)\
$docker_context\
[](fg:blue bg:mauve)\
$time\
[ ](fg:mauve)\
$line_break$character"""

[os]
disabled = false
style = "bg:surface0 fg:on_surface0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface0 fg:on_surface0"
style_root = "bg:surface0 fg:on_surface0"
format = '[ $user ]($style)'

[directory]
style = "fg:on_peach bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:on_green bg:green"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:on_green bg:green"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[dotnet]
symbol = "󰪮"
style = "fg:on_teal bg:teal"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:on_blue bg:blue"
format = '[ $symbol( $context) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:on_mauve bg:mauve"
format = '[  $time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:mauve)'
vimcmd_replace_symbol = '[](bold fg:mauve)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

# >>> ZZ STARSHIP PALETTE >>>
[palettes.zz]
blue = "#89b4fa"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
cyan = "#94e2d5"
magenta = "#cba6f7"
white = "#cdd6f4"
black = "#11111b"
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
maroon = "#eba0ac"
peach = "#fab387"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
# Text colors are checked against their segment background during sync.
on_surface0 = "#cdd6f4"
on_peach = "#1e1e2e"
on_green = "#1e1e2e"
on_teal = "#1e1e2e"
on_blue = "#1e1e2e"
on_mauve = "#1e1e2e"
