id = "terra"
kind = "terra"
label = "Terra"
description = "Terra repository for optional apps such as Zed and T3 Code"
gpg_policy = "unsigned-bootstrap"
bootstrap_exception = true
# The release package is fetched unsigned once to obtain terra-gpg-keys.
# From then on the repository's own configuration applies: packages and
# repository metadata are both GPG-verified against the shipped
# RPM-GPG-KEY-terra<release> key (terra-release sets gpgcheck=1 and
# repo_gpgcheck=1, and Terra signs repomd.xml with that key).
reason = "Bootstraps Terra release packages unsigned before installing optional apps; packages and repository metadata are GPG-verified against the shipped Terra key afterwards"
# Terra also packages the DMS stack; the Dux Labs COPRs own it here, so
# keep Terra from ever shadowing those builds. noctalia-qs declares
# "Provides: quickshell", so without its exclusion the solver can pick it
# from Terra to satisfy the dms RPM's "(quickshell or quickshell-git)"
# dependency in place of the real COPR quickshell.
excludepkgs = [
  "quickshell",
  "quickshell-git",
  "noctalia-qs",
  "matugen",
  "dgop",
  "dux-gop",
  "danksearch",
  "dux-search",
  "dms",
  "dms-cli",
  "dms-greeter",
  "dux-greeter",
  # The scottames/ghostty COPR owns Ghostty. Its single RPM ships the files
  # Terra splits into subpackages, so keep all of Terra's out of the solver.
  "ghostty*",
  "libghostty-vt*",
]
