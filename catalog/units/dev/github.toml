id = "dev-github"
description = "GitHub bar widget for the desktop shell"
config = ["dms-plugin-github"]

[choice]
category = "dev"
id = "github"
label = "GitHub widget"
default = true
order = 90
description = "Review pull requests, triage issues and notifications, and watch Actions runs from the bar through the GitHub CLI"

# The widget does everything through gh, which the base shell-gh unit
# already installs; naming it keeps the dependency explicit and is an
# idempotent no-op on every install path. libnotify's notify-send carries
# the desktop notifications, which wait for the click that opens the thread
# in the popout. kf6-syntax-highlighting's QML module colors code in bodies
# with its GitHub themes, as github.com does (code stays one color without
# it), qt6-qtmultimedia's plays video attachments in place (a link to
# them without it), and curl copies animated images so they loop (still
# without it). The shell itself is base.
[[install]]
backend = "dnf"
packages = ["gh", "libnotify", "kf6-syntax-highlighting", "qt6-qtmultimedia", "curl"]
