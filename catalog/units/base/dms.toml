id = "base-dms"
description = "DMS (DankMaterialShell) desktop shell bundle for Fedora"
config = ["dms"]
# The danksearch indexer is session-agnostic (WantedBy=default.target), so
# it is plainly enabled. dms.service is bound to the Niri unit instead of
# enabled: its [Install] target is graphical-session.target, which every
# desktop activates, and the shell must not launch inside a pre-existing
# GNOME/KDE session where it would fight the native shell for the
# notification bus.
user_services = ["dsearch.service"]
user_wants = ["niri.service/dms.service"]

[base]
order = 80

# quickshell is named explicitly even though the dms RPM depends on it:
# the dependency is the boolean "(quickshell or quickshell-git)", which any
# package with a "Provides: quickshell" satisfies, leaving dnf free to keep
# a wrong provider instead of installing the DankLinux COPR build.
[[install]]
backend = "dnf"
sources = ["copr:avengemedia/dms", "copr:avengemedia/danklinux"]
packages = [
  "dms",
  "quickshell",
  "matugen",
  "danksearch",
  "cava",
  "gnome-keyring",
  "gnome-keyring-pam",
  "qt6-qtimageformats",
  "kf6-kimageformats",
]
