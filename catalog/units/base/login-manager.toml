id = "base-login-manager"
description = "DMS Greeter login manager for Fedora"
config = ["greeter-gpu-wait"]

[base]
order = 60

[[install]]
backend = "dnf"
packages = ["policycoreutils-python-utils", "acl", "greetd"]

[[install]]
backend = "action"
sources = ["copr:duxlabs/dux-repo"]
actions = ["dms-greeter"]
