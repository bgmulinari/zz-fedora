id = "base-screenshot-tools"
description = "Screenshot annotation editor and clipboard bridge behind the shipped screenshot keybinds"
config = ["screenshot-tools"]

[base]
order = 185

# wl-clipboard is named explicitly even though it is usually present: satty
# publishes the finished capture through wl-copy, and no other base unit owns
# that command. Fedora does not package satty; Terra does, so the step
# enables it rather than relying on an optional choice to have done so.
[[install]]
backend = "dnf"
sources = ["terra"]
packages = ["satty", "wl-clipboard"]
