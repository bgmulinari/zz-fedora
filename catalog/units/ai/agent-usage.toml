id = "ai-agent-usage"
description = "Coding-agent usage bar widget for the desktop shell"
config = ["dms-plugin-agent-usage"]

[choice]
category = "ai"
id = "agent-usage"
label = "Agent usage widget"
default = true
order = 50
description = "Show Claude Code and Codex rate limits and token usage in the bar"

# The collectors are stdlib Python scripts with a /usr/bin/python3 shebang;
# the shell itself is base. python3 is also a bootstrap prerequisite, so this
# step is an idempotent no-op on every install path.
[[install]]
backend = "dnf"
packages = ["python3"]
