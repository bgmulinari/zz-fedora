ELECTRON_OZONE_PLATFORM_HINT=auto
# Chromium and Electron pick the Secret Service only on desktops they recognize,
# and fall back to weak "basic" storage under niri. When XDG_CURRENT_DESKTOP and
# DESKTOP_SESSION match nothing, they treat this legacy marker as GNOME and use
# gnome-keyring. It leaves XDG_CURRENT_DESKTOP, portals, and autostart alone.
GNOME_DESKTOP_SESSION_ID=this-is-deprecated
TERMINAL=xdg-terminal-exec
PATH=${HOME}/.local/bin:${PATH:-/usr/local/bin:/usr/bin}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=qt6ct
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=niri
XDG_CURRENT_DESKTOP=niri
XCURSOR_THEME=Qogir
XCURSOR_SIZE=24
