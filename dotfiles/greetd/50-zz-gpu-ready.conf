# Installed by ZZ. Hold the greeter until udev has finished with the display
# controllers and their DRM nodes; see /usr/lib/zz/greeter-wait-for-gpu.
# Mask it with an empty file of the same name in
# /etc/systemd/system/greetd.service.d/.
#
# akmods.service, which builds and loads a missing NVIDIA module at boot,
# already orders itself Before=display-manager.service, the alias greetd is
# enabled under, so no ordering is declared here.
#
# The helper is installed as a plain 0644 file, like every managed system
# file, so bash runs it. The leading '-' keeps any failure non-fatal; the
# helper also bounds its whole wait to 30s, well inside the start timeout.
[Service]
ExecStartPre=-/usr/bin/bash /usr/lib/zz/greeter-wait-for-gpu
