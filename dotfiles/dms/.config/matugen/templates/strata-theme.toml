# ZZ-managed Strata theme rendered by the DMS matugen pipeline and
# published to ~/.config/strata/themes/dms.toml; templates/strata/dms.toml is the
# Catppuccin fallback with the same keys. Strata picks its light or dark
# base from the background, so the mode needs no key of its own.
name = "DMS"
background = "{{colors.background.default.hex}}"
surface = "{{colors.surface_container_low.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
accent = "{{colors.primary.default.hex}}"
danger = "{{colors.error.default.hex}}"
muted = "{{colors.surface_container_high.default.hex}}"
highlight = "{{colors.primary_container.default.hex}}"
border = "{{colors.surface_container_highest.default.hex}}"
dim_text = "{{colors.on_surface_variant.default.hex}}"
syntax_keyword = "{{colors.tertiary.default.hex}}"
syntax_string = "{{colors.secondary.default.hex}}"
syntax_constant = "{{colors.tertiary_fixed_dim.default.hex}}"
syntax_type = "{{colors.primary.default.hex}}"
syntax_preprocessor = "{{colors.on_surface_variant.default.hex}}"
